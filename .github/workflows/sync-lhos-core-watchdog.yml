name: Sync LHOS Core Watchdog

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      N8N_BASE_URL: https://n8n-production-42eb.up.railway.app
      N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
      LHOS_WORKFLOW_ID: VUadvfAMj6cGA7dx
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Patch and verify live n8n workflow
        run: python scripts/sync_n8n_core_watchdog.py
