name: LHOS Cloud Automation Watchdog

on:
  repository_dispatch:
    types: [healthchecks-down]
  schedule:
    # Every 10 min across the ET active window (UTC). Off-peak minutes (:07/:17...)
    # because GitHub delays/drops schedules that land on :00 under load.
    - cron: '7,17,27,37,47,57 11-21 * * *'
    # Keep-alive + off-window audit so a broken state is caught overnight.
    - cron: '23 2 * * *'
  workflow_dispatch:

concurrency:
  group: lhos-cloud-watchdog
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Detect and auto-repair known failure modes
        env:
          N8N_BASE_URL: https://n8n-production-42eb.up.railway.app
          N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
          LHOS_WORKFLOW_ID: VUadvfAMj6cGA7dx
          LHOS_BACKEND_URL: https://lhos-beta-email-production.up.railway.app
          LHOS_AUTOMATION_TOKEN: ${{ secrets.LHOS_AUTOMATION_TOKEN }}
          HEARTBEAT_URL: ${{ secrets.HEARTBEAT_URL }}
          HEARTBEAT_FAIL_URL: ${{ secrets.HEARTBEAT_FAIL_URL }}
          DAILY_OUTCOME_URL: ${{ secrets.DAILY_OUTCOME_URL }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_MONTHLY_WARN_DOLLARS: "10.00"
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/watchdog_remediate.py
